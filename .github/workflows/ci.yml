name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo to run tests.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      # Guards against deleted/renamed modules leaving dangling imports — the
      # failure mode behind 0f264d6, which deleted whole subsystems yet left
      # main importing them. Catches it even where the modules have no tests.
      - name: Import check (all modules)
        run: python scripts/check_imports.py

      # Integration/network tests are excluded by default via pytest.ini
      # (addopts = -m "not integration"), so this run is hermetic — no network,
      # no API keys required.
      - name: Run tests
        run: python -m pytest -q
