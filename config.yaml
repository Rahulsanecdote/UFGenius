account_size: 10000
risk_per_trade: 0.01
max_position_pct: 0.10
scan_universe: SP500  # SP500 | RUSSELL1000 | CUSTOM | MOVERS

# Market-movers discovery (the MOVERS universe / `bot.py --mode movers`). Surfaces
# the day's actual market-wide movers — top gainers, losers, most-actives (FMP) —
# ranked with a long/short direction, for intraday trading. Needs FMP_KEY. The
# standard disqualification filters + RiskGuard still run downstream, so most
# low-quality movers (penny/illiquid/already-spiked chasers) are filtered out by
# design — discovery is broad, the gates stay strict.
movers:
  sources: [gainers, losers, most_actives]  # which FMP lists to pull
  min_price: 1.0            # drop sub-$1 names (penny/liquidity guard); lower at your own risk
  max_price: 0              # 0 = no upper cap
  min_change_pct: 3.0       # only consider names moving at least this % (absolute)
  # Corporate-action guard. The FMP lists report an UNADJUSTED quote change, so
  # on a reverse-split effective date the mechanical price multiple is reported
  # as a move (AiRWA/YYAI 1-for-20 on 2026-08-17 showed as "+1668%" while the
  # stock was up ~23%). Above this magnitude the number is re-derived from our
  # own split-adjusted daily bars, and dropped if it can't be verified.
  # 0 disables the guard. 300% is far above a plausible single session and far
  # below the ratios reverse splits produce.
  suspect_change_pct: 300.0
  limit: 40                 # max ranked candidates returned
  include_short_setups: true  # losers → SHORT-direction candidates
  # Phase 2 — enrich each mover with LIVE intraday signals (relative volume,
  # momentum, VWAP position, breakout) and rank by early-momentum QUALITY, not
  # just raw % change. Adds one intraday fetch per candidate (Alpaca/Polygon/yf).
  enrich_intraday: true     # blend intraday signals into the rank
  enrich_interval: "5m"     # intraday bar size for enrichment
  enrich_max: 40            # cap how many candidates get the intraday fetch (cost guard)
  # Phase 3 — screener-style alerts. When a mover clears these criteria, send a
  # Telegram alert (needs TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID) explaining why,
  # with the supporting metrics, a confidence score, and long/short direction.
  # Opt-in, default OFF (no spam).
  alerts:
    enabled: false          # master switch
    min_score: 70           # only alert candidates scoring >= this (0-100)
    require_enriched: true   # only alert when live intraday signals are present
    dedup_ttl_sec: 1800     # don't re-alert the same ticker+direction within this window
    max_per_run: 10         # cap alerts per scan cycle (spam guard)
  # Phase 4 — post-open monitoring + invalidation. Keep watching alerted movers
  # after the open and INVALIDATE a signal when the setup breaks down (momentum
  # turns against it, it loses VWAP, volume fades, or the quality score collapses).
  # `bot.py --mode movers-monitor` discovers → alerts → then loops this.
  monitor:
    enabled: false            # master switch (the monitor mode still runs; this gates invalidation alerts)
    poll_interval_sec: 60     # seconds between re-evaluations
    rel_volume_floor: 1.0     # invalidate when current relative volume drops below this
    momentum_flip: -0.5       # invalidate when aligned momentum <= this (turned against the setup)
    require_vwap_hold: true    # invalidate on losing VWAP (price on the wrong side)
    min_score: 50             # invalidate when the enriched quality score falls below this
    alert_on_invalidation: true  # send a Telegram note when a watched signal invalidates
  # Phase 5 — always-on worker. Runs discover → alert → monitor → invalidate in a
  # loop with NO browser (bot.py --mode movers-worker, or a Render Background
  # Worker). Needs FMP_KEY + Telegram creds; set movers.alerts.enabled and
  # movers.monitor.enabled true for it to actually push.
  worker:
    poll_interval_sec: 60        # monitor re-evaluation cadence
    rediscover_every_cycles: 5   # re-run discovery every N cycles (≈5 min at 60s)
    market_hours_only: true      # only scan during the pre-market→close window
    # Phase 7 — shared worker↔web state (the worker publishes a snapshot each
    # cycle; the dashboard reads it via /api/movers-worker).
    # state_path: data/movers_worker.json   # default; shared across processes
    state_stale_sec: 180         # snapshot older than this → UI shows worker STALE
    state_max_recent: 20         # ring size for recent alerts / invalidations
  # Phase 8 — real-time price streaming (Alpaca trade websocket). Opt-in; the
  # worker keeps its live watch set subscribed and reacts to price on push
  # instead of the next REST poll. Needs ALPACA_API_KEY/SECRET.
  stream:
    enabled: false             # default off — falls back to REST polling
    feed: iex                  # iex (free) | sip (paid)
    stale_sec: 10              # a tick older than this = quiet tape
    max_symbols: 30            # cap on concurrently-subscribed symbols

safety_rules:
  max_positions: 5
  max_portfolio_risk_pct: 5.0
  max_daily_loss_pct: 2.0
  max_weekly_loss_pct: 5.0
  cash_reserve_pct: 20.0
  min_market_cap: 300000000
  min_daily_volume: 200000
  max_single_position_pct: 10.0
  max_trades_per_day: 3
  stop_loss_required: true
  trade_in_bear_market: false
  trade_earnings_week: false
  earnings_week_window_days: 7   # block window (days before earnings) when trade_earnings_week is false
  cooldown_after_loss_hours: 24
  paper_trade_days_required: 30  # enforced by RiskGuard on the live path (ALPACA_PAPER=false)

# Circuit breakers (upgrade plan P0.3). Halt NEW entries on stale data, repeated
# broker failures, or an operator's global halt switch. Enforced in RiskGuard,
# surfaced + toggled from the dashboard. Exits are never blocked.
circuit_breakers:
  data_staleness_max_seconds: 900   # block entries when a plan's capture time is older than this at execution (0 disables); coarse daily-bar guard, P1 tightens for intraday
  broker_error_threshold: 3         # trip after N broker failures within the window (<=0 disables)
  broker_error_window_seconds: 300  # rolling window for the broker-error count
  state_path: "data/circuit_breaker.json"  # shared halt flag + broker-error ledger

# Paper-trading scorecard (upgrade plan P0.4). Computes the SAME trade-level
# metrics as the backtest validation from realized paper trades, so paper
# results are directly comparable to the backtest. When performance_gate_enabled
# is true, going live (ALPACA_PAPER=false) requires the paper scorecard to clear
# these floors — not just paper_trade_days_required tenure.
paper_scorecard:
  min_trades: 20                  # need at least this many closed paper trades before a verdict
  profit_factor_floor: 1.2        # gross profit / gross loss must clear this
  prob_profitable_floor: 0.55     # bootstrap fraction of profitable resamples
  require_positive_expectancy: true  # mean per-trade P&L must be > 0
  performance_gate_enabled: true  # gate live trading on scorecard performance, not just tenure
  max_trades_retained: 5000       # cap on retained closed-trade outcome records (bounds the store)
  # Paper-vs-validated-backtest tolerance gate. The floors above ask "is paper good
  # enough?"; this asks "does paper still look like the edge validated out-of-sample?".
  # Needs a baseline saved by `python bot.py --mode validate --save-baseline`.
  baseline_gate_enabled: false    # opt-in: also require paper within tolerance of the validated backtest before live
  baseline_tolerance_pct: 30      # paper win rate / profit factor may sit up to this % BELOW the validated OOS values (one-sided; outperformance never blocks)
  baseline_max_age_days: 180      # refuse a baseline older than this — a stale reference is not evidence of a current edge
  baseline_path: "data/validated_baseline.json"  # where --save-baseline writes the reference

# Intraday data layer (upgrade plan P1.1). Governs intraday OHLCV bars (1m/5m/…):
# a bar-scaled cache TTL and the look-ahead / staleness guards.
intraday:
  default_interval: "5m"        # default intraday bar size for fetch_intraday
  cache_boundary_align: true    # expire the intraday cache at the next bar boundary (+settle) so a newly-closed bar is picked up promptly, instead of a fixed TTL from fetch time. Sub-hour clock-aligned bars (1m/2m/5m/15m/30m) only; hourly+/90m are session-phased and keep the legacy TTL
  cache_settle_sec: 5           # grace after a bar boundary for the provider to publish the closed bar before the cache refetches
  cache_ttl_floor_sec: 30       # floor on the bar-scaled intraday cache TTL (legacy path only — used when cache_boundary_align is false)
  max_staleness_intervals: 3    # a frame older than N bars is considered stale
  future_bar_tolerance_sec: 5   # clock-skew grace before dropping future-labelled bars

# Continuous intraday scan loop (upgrade plan P1.2). Replaces the 6 fixed slots
# with a short-interval scanner over live intraday bars (via fetch_intraday),
# emitting deduped candidates into an in-process queue for the entry logic (P1.3).
# Rate/cost-aware: bounded universe, interval floor, cached bars, dedup window.
continuous_scan:
  # 1m bars polled every 15s (the loop floor). With the boundary-aligned intraday
  # cache (intraday.cache_boundary_align, default on) the cache expires just after
  # each bar closes (+settle), so the first poll after a close re-fetches the new
  # bar: reaction to a newly-closed bar tracks the ~15s poll cadence (plus a few
  # seconds settle), still one provider call per bar. This is NOT sub-minute
  # *resolution* — 1m is the smallest bar the providers serve and the forming bar
  # is dropped by the look-ahead guard. lookback_bars are counts, so on 1m they
  # span minutes (6-min momentum, 20-min breakout high).
  interval_sec: 15             # seconds between scan cycles (floored to _MIN_INTERVAL_SEC=15)
  interval: "1m"               # intraday bar size to scan (1m is the provider floor)
  universe_cap: 100            # max tickers scanned per cycle (cost guard)
  dedup_ttl_sec: 60            # ~one 1m bar: suppress the same (ticker,kind) re-scored from cached intra-bar polls, but let the NEXT bar re-qualify (track ~1 bar; was 300 = one 5m bar)
  queue_max: 500               # bounded candidate queue (drops oldest beyond this)
  rel_volume_threshold: 2.0    # current-bar volume vs recent intraday average → unusual volume
  momentum_pct_threshold: 1.5  # abs % move over the momentum lookback → momentum candidate
  momentum_lookback_bars: 6    # bars used for the intraday momentum measure
  breakout_lookback_bars: 20   # bars used for the intraday high (breakout) measure
  min_bars: 10                 # minimum intraday bars required before scoring a ticker
  premarket_start_et: "07:00"  # scan window opens here (ET) so gappers surface before the open
  min_gap_pct: 5.0             # daily-boundary gap threshold for gap candidates

# Intraday signal + entry/exit logic (upgrade plan P1.3). Deterministic intraday
# entry: reclaim/hold above VWAP + opening-range breakout + volume confirmation,
# with an intraday-ATR stop. Consumes the P1.2 candidate queue.
intraday_signal:
  opening_range_minutes: 30    # session opening-range window (high/low) for breakouts
  min_rel_volume: 1.5          # current-bar volume vs session average to confirm participation
  require_above_vwap: true     # entries must be trading above session VWAP
  atr_period: 14               # bars for the intraday ATR stop
  min_session_bars: 6          # minimum current-session bars before an entry can fire
  consumer_max_per_cycle: 20   # candidates evaluated per consumer drain (cost guard)

# Sweep-reclaim reversal entry (liquidity-grab / stop-hunt timing). A deterministic
# intraday REVERSAL entry (the counterpart to the breakout above): price sweeps a
# recent swing low then reclaims it on volume → long, stop just below the swept
# wick. Default OFF — opt-in, and a timing hypothesis to validate out-of-sample
# before real money. The consumer only evaluates it when `enabled: true`.
sweep_reclaim:
  enabled: false               # master switch (consumer skips this path when false)
  lookback_bars: 15            # bars defining the swept swing low (the liquidity level)
  reclaim_window_bars: 2       # bars within which the sweep + reclaim must occur
  min_rel_volume: 1.5          # reclaim-bar volume vs session average to confirm participation
  require_volume: false        # if true, NO entry without volume confirmation (else volume only upgrades BUY→STRONG_BUY)
  stop_buffer_pct: 0.001       # stop placed this fraction below the swept wick low
  max_reclaim_extension_pct: 0.05  # reject if close is already >5% above the swept level (chasing)
  min_session_bars: 20         # minimum current-session bars before it can fire
  # Level-anchored variant (default OFF — []). Adds pre-marked session levels as
  # sweepable liquidity levels alongside the rolling swing low: "pdl" = previous
  # session's regular-hours low, "pml" = today's pre-market low (needs
  # extended-hours bars; silently absent otherwise). The chosen level is the
  # HIGHEST one both swept and reclaimed. Provenance: the discretionary
  # "opening reversal at pre-marked levels" playbook — practitioner convention
  # (Tier C), unvalidated; A/B it with --mode intraday-backtest before believing it.
  level_anchors: []            # e.g. [pdl, pml]
  # Opening-window filter (default OFF — both empty): entries only when the last
  # bar's ET time is in [start, end). The opening half-hour is where overnight
  # imbalances resolve; any EXACT minute choice is unvalidated precision.
  entry_window_start: ""       # ET HH:MM, e.g. "09:30"
  entry_window_end: ""         # ET HH:MM, e.g. "10:30"

# Intraday backtest harness (--mode intraday-backtest). Replays the deterministic
# intraday ENTRIES (breakout / sweep-reclaim) bar-by-bar on historical intraday
# bars with no look-ahead: a signal on bar T fills at bar T+1's open (same
# session only), the position is managed intrabar (stop-priority, target
# partials) and forced FLAT at session end — day-trading, no overnight holds.
# Reuses the daily cost model (backtest_commission_pct / backtest_slippage_pct).
intraday_backtest:
  max_lookback_bars: 400       # bars of history handed to the evaluator each step (bounds cost; must exceed a session + ATR warmup)
  max_tickers: 50              # cap on universe tickers backtested per run (cost guard)
  min_frame_bars: 5            # skip a ticker whose fetched intraday frame has fewer bars than this
  min_trades: 30               # trades required before the acceptance check trusts the edge (significance floor)
  min_profit_factor: 1.2       # acceptance: profit factor (gross-win R / gross-loss R) must clear this
  max_drawdown_pct: -25.0      # acceptance: equity max drawdown must stay above this (magnitude; sign-normalized)

# Catalyst gating (upgrade plan P1.4). A calendar-backed earnings source (used
# by the RiskGuard earnings-week block) plus an optional catalyst-tag veto so
# entries carrying a hard catalyst (halt, fraud, investigation, …) are refused —
# never a naked buy into a known catalyst.
catalysts:
  earnings_calendar_path: "data/earnings_calendar.json"  # {"AAPL": "2026-02-01", ...} (ISO dates)
  enable_catalyst_gate: true          # RiskGuard vetoes entries carrying a veto catalyst tag
  veto_tags:                          # tags that hard-veto an entry (case-insensitive)
    - TRADING_HALT
    - SEC_INVESTIGATION
    - FRAUD
    - GOING_CONCERN
    - BANKRUPTCY

# Execution-quality measurement (upgrade plan P2.1). Records expected vs realized
# fill per order → implementation shortfall / realized slippage, and can feed the
# measured slippage back into the backtest cost model so simulated edge tracks
# reality instead of a static estimate.
execution_quality:
  ledger_path: "data/execution_quality.json"   # per-fill quality ledger (bounded)
  max_fills_retained: 5000                       # cap on retained fill records
  use_measured_slippage: false                   # backtest uses measured slippage when enough fills exist
  min_fills_for_measured: 20                     # trust measured slippage only after this many fills

# Smart order handling (upgrade plan P2.2). Price entries as a MARKETABLE limit —
# crossing the market by a small, bounded offset tuned to the P2.1 measured
# slippage — so entries fill promptly without chasing, while the plan's price
# stays the accounting benchmark. Default off (plain limit at the plan price).
smart_orders:
  enabled: false                 # when true, entries use a marketable-limit price
  entry_offset_floor_pct: 0.001  # minimum crossing (0.1%) so the limit is actually marketable
  entry_offset_cap_pct: 0.01     # maximum crossing (1%) — hard cap on how far we chase

# Observability stack (upgrade plan P2.3). A bounded per-scan metrics ledger
# (latency, signal counts, data-gap detection) surfaced on the dashboard, plus
# opt-in operational alerts for circuit-breaker trips and data gaps.
observability:
  metrics_ledger_path: "data/metrics.json"  # per-scan metrics ledger (bounded)
  metrics_max_scans: 2000                    # cap on retained scan records
  # Flag/alert a data gap after this many seconds without a scan. DEFAULT 0 =
  # disabled: raw elapsed time cannot tell a real outage from a normal quiet
  # period (overnight ~9h, weekends ~63h with the schedule above), so a naive
  # threshold would false-alarm. Set this ABOVE your deployment's real
  # inter-scan cadence before enabling, or drive outage detection from an
  # external watchdog polling GET /api/metrics (seconds_since_last_scan).
  data_gap_seconds: 0
  alerts:
    enabled: false                           # operational alerts (breaker trips, data gaps) — opt-in

# Explainability layer (upgrade plan P3.1). An OPTIONAL LLM narrative that reads
# the verified quant snapshot and writes a human-readable bull/bear rationale for
# the dashboard/alerts. Advisory ONLY — it never gates, sizes, or places an order,
# is sandboxed against prompt injection (structured data only), and is cost-capped.
# Default OFF; needs ANTHROPIC_API_KEY when enabled.
explain:
  enabled: false             # master switch — a no-op until turned on
  provider: "anthropic"      # "anthropic" (Claude) or any OpenAI-compatible provider
                             # ("openai" for OpenAI / NVIDIA Nemotron / OpenRouter / local)
  model: "claude-opus-5"     # model id for the chosen provider; for Nemotron e.g.
                             # "nvidia/llama-3.1-nemotron-ultra-253b-v1"
  # base_url: ""             # OpenAI-compatible endpoint, e.g. https://integrate.api.nvidia.com/v1
  # api_key: ""             # prefer the EXPLAIN_API_KEY env var over putting a key here
  max_tokens: 1000           # hard per-call output cap (cost guard)
  temperature: 0.3           # OpenAI-compatible path only (Anthropic path uses effort=low)
  timeout_seconds: 30
  daily_call_cap: 50         # max narrations per day (cost guard); <=0 disables the cap
  call_ledger_path: "data/explain_calls.json"

# Portfolio + Risk Engine (universal-engine roadmap Phase 4). An ADVISORY,
# default-OFF layer that computes volatility/correlation-aware position sizing
# and portfolio-level risk metrics (gross leverage, single-name weight,
# portfolio heat, correlated-cluster exposure, equity drawdown). It NEVER
# replaces or bypasses RiskGuard — with enabled=false it is a no-op, surfaced
# only for review (GET /api/portfolio-risk). gate_entries is a separate opt-in
# that lets the engine veto/scale in the money path; keep it OFF until the edge
# is validated. Estimates degrade gracefully (missing return history → those
# checks are skipped, never a false veto).
portfolio:
  enabled: false                 # master switch for the advisory layer (no-op when false)
  gate_entries: false            # opt-in: consult the engine in the money path (veto/scale). Default off
  min_return_history: 10         # minimum overlapping returns before a correlation estimate is trusted
  max_gross_leverage: 1.0        # ceiling on sum(position values)/equity including the candidate
  max_single_weight_pct: 20.0    # portfolio-level single-name weight ceiling (% of equity)
  max_portfolio_heat_pct: 6.0    # ceiling on sum(open risk)/equity including the candidate risk
  correlation_threshold: 0.6     # pairwise return correlation at/above which names form a cluster
  max_cluster_weight_pct: 35.0   # combined weight ceiling for a correlated cluster (% of equity)
  max_drawdown_halt_pct: 15.0    # peak-to-trough equity drawdown that vetoes NEW entries (0 disables)
  peak_equity_path: "data/portfolio_peak_equity.json"  # persisted equity high-water mark for the drawdown halt

schedule:
  pre_market: "06:00"
  market_open: "09:25"
  intraday_1: "11:00"
  intraday_2: "14:00"
  post_market: "16:30"
  overnight: "21:00"

alerts:
  telegram_enabled: false
  email_enabled: false
  triggers:
    - STRONG_BUY
    - STRONG_SELL

signal_weights:
  technical: 0.35
  volume: 0.20
  sentiment: 0.20
  fundamental: 0.15
  macro: 0.10

atr_stop_multiplier: 2.0
target_rr_ratios: [1.5, 2.5, 4.0]
target_exit_pcts: [30, 40, 30]

# Disqualification filter thresholds
# BANKRUPTCY_Z: Altman Z-Score < 1.0 is the academic distress zone (Altman, 1968)
filter_min_avg_volume: 100000      # Minimum 20-day average daily volume (liquidity floor)
filter_min_market_cap: 100000000   # Minimum market cap $100M (nano-cap trap floor)
filter_max_5day_gain_pct: 50.0     # Maximum 5-day gain % before flagging as chaser trap
filter_bankruptcy_z: 1.0           # Altman Z-Score below this = bankruptcy risk

# Penny-stock mode (OPT-IN, default OFF). Enabling this does NOT disable
# protection — it swaps the standard disqualifiers for penny-specific HARD RAILS.
# The dollar-volume and market-cap floors are what actually keep out the
# manipulated nano-caps and 0-volume names that "biggest daily gainer" screens
# are full of; the bankruptcy check stays ON (so post-bankruptcy tickers are
# rejected). Scan/paper only until you've validated an edge — do not point live
# execution at this without --mode validate first and tiny position sizing.
#
# Usage: set enabled true, list tickers in custom_watchlist (or CUSTOM_WATCHLIST
# env), set scan_universe: CUSTOM, and run `python bot.py --mode intraday-scan`.
penny:
  enabled: false                 # master switch (mirrors ALLOW_PENNY_STOCKS env)
  custom_watchlist: ""           # comma-separated tickers, e.g. "BOXL,HYLN,DOGZ" (or CUSTOM_WATCHLIST env)
  min_price: 0.50                # sub-penny floor (spreads/manipulation worst below this)
  max_price: 10.0               # low-price band ceiling
  min_share_volume: 100000       # 20-day avg share-volume floor (NOT relaxed vs standard)
  min_dollar_volume: 3000000     # price × avg volume — primary liquidity gate ($3M)
  min_market_cap: 50000000       # FLOOR, not 0 — cuts the sub-$50M pump-and-dump zone
  max_5day_gain_pct: 30.0        # tighter chaser-trap than standard (don't buy after the pop)

# Screener presets — named pre-trade filters (`python bot.py --mode screen
# --preset <name>`). A screener finds *candidates*, not edge: the output is a
# filtered watchlist you feed into --mode scan / --mode intraday-scan, which
# (after validation) decide anything about money. Criteria are checked against
# data the bot can compute (price, SMA20/50/200, RSI14, avg/rel volume, 50-day
# high, 1d change, market cap); ROE / debt-equity are OPTIONAL and skipped when
# the free data provider doesn't supply them. Add/edit presets freely.
screener:
  # Feature lookback periods (config-driven — no hardcoded thresholds). SMA
  # periods also decide which `smaN` features exist for presets to reference.
  sma_periods: [20, 50, 200]
  rsi_period: 14
  volume_lookback: 20        # baseline is the PRECEDING N bars (current bar excluded)
  high_lookback: 50          # "new high" window
  presets:
    # Oversold names starting to turn up on high relative volume — the
    # dip-reversal ("bounce play") candidates.
    oversold-bounce:
      description: "Oversold, turning up, on 2x relative volume"
      min_price: 5.0
      rsi_max: 40            # oversold-ish
      min_rel_volume: 2.0    # 2x its normal volume
      require_change_up: true  # already ticking back up (not a falling knife)
    # Pulled back to between the 20- and 50-day MA, holding the 20 as support.
    ma-bounce:
      description: "Above the 20-day MA but below the 50-day MA, on rising volume"
      require_above_sma: ["20"]
      require_below_sma: ["50"]
      min_avg_volume: 400000
      min_rel_volume: 1.0
    # Strong uptrend making a new 50-day high on real volume.
    breakout:
      description: "Above 20/50/200-day MA, new 50-day high, liquid"
      require_above_sma: ["20", "50", "200"]
      require_new_high: true
      min_avg_volume: 100000
      min_roe_pct: 20         # optional quality filter (skipped when ROE unknown)

# Pre-market gap screener (src/scanner/premarket_scan.py, --mode premarket-scan,
# GET /api/scan-premarket). SCREENER ONLY: a ranked research watchlist from
# extended-hours bars — not trade signals, and no protection filter is loosened.
# Threshold provenance is documented in docs/PREMARKET_SCREENER.md (consensus
# practitioner defaults + published-evidence direction; none are validated alpha).
premarket:
  interval: "5m"                  # extended-hours bar size for aggregates
  period: "15d"                   # lookback (must cover rvol history sessions)
  max_results: 20
  workers: 8                      # snapshot fan-out threads (provider semaphore still caps upstream)
  universe_cap: 100               # max tickers per scan — truncation is DISCLOSED in output, never silent
  # Hard gates (mechanical liquidity/size floors)
  min_gap_pct: 4.0                # consensus gap-and-go floor ("under 4% tends to fill")
  min_price: 2.0                  # sub-$2 = delisting/reverse-split adverse-selection zone
  max_price: 100.0
  min_pm_volume: 100000           # modal practitioner floor (shares)
  min_pm_dollar_volume: 1000000   # the honest liquidity measure ($)
  min_adv_20d: 500000             # regular-session backstop (shares/day)
  # Time-of-day RVOL (cum PM volume vs same clock window on prior sessions)
  rvol_min_history_sessions: 5
  rvol_min_baseline_shares: 10000 # below this the ratio is a mirage → rvol omitted
  # Liquidity floor: the continuation/fade divider from the evidence review.
  # RVOL only earns score above it; below it extreme volume marks the fade cohort.
  liquidity_floor_price: 10.0
  liquidity_floor_adv: 1000000
  micro_float_shares: 10000000
  # Gap-band score: rises to [peak_lo, peak_hi], decays to floor_beyond at extreme
  # (extreme gaps buy variance, not mean).
  gap_score_min: 4.0
  gap_score_peak_lo: 6.0
  gap_score_peak_hi: 15.0
  gap_score_extreme: 30.0
  gap_score_floor_beyond: 0.2
  # Composite weights (sum needn't be 1; renormalised). NOT validated alpha —
  # they encode the direction of published evidence only.
  weights:
    rvol: 0.35                    # best-supported factor (SSRN 4729284)
    gap_band: 0.20
    dollar_volume: 0.15
    float_rotation: 0.15
    catalyst: 0.15                # earnings-calendar hit; unknown stays neutral
  # Saturation scales (the ~0.63 point of each diminishing-returns curve)
  rvol_scale: 5.0                 # "5x = super in play"
  dollar_volume_scale: 5000000
  rotation_scale: 0.25            # 0.25–0.5x PM rotation on a small float = exceptional
  # Profile tags
  fade_extreme_gap_pct: 20.0
  fade_pm_volume_shares: 5000000  # SmallCapLab: 5M+ PM shares → 71.5% fade (micro floats)
  continuation_min_rvol: 2.0      # "in play" threshold
  catalyst_earnings_window_days: 1
  # News catalyst feed (src/catalysts/news_feed.py). Headlines fetched via
  # Alpaca News API (existing keys) → yfinance → NewsAPI, keyword-classified
  # into tiers: strong (beat/guidance-raise/FDA/M&A/contract/upgrade),
  # moderate (earnings mention, investor day, initiation), weak
  # ("why is X soaring" churn), dilution (offering/warrants/reverse split →
  # dilution_news flag, never a catalyst). Deterministic heuristic, not
  # verification; fail-soft (no source ⇒ catalyst stays unknown).
  news:
    enabled: true
    max_age_hours: 36
  # Catalyst score per tier (0-1, clamped). Provenance: post-news drift is
  # measured for hard events (PEAD/Savor); moderate news gets half weight;
  # attention-churn gets none.
  catalyst_scores:
    earnings: 1.0
    news_strong: 1.0
    news_moderate: 0.5
    news_weak: 0.0
    unknown: 0.0
  # Which catalyst tiers count toward the `continuation` profile.
  continuation_catalysts: [earnings, news_strong]

# Signal classification thresholds (score out of 100)
signal_thresholds:
  - [80, "STRONG_BUY",  "VERY_HIGH"]
  - [65, "BUY",         "HIGH"]
  - [50, "WEAK_BUY",    "MODERATE"]
  - [40, "HOLD",        "LOW"]
  - [25, "WEAK_SELL",   "MODERATE"]
  - [10, "SELL",        "HIGH"]
  - [0,  "STRONG_SELL", "VERY_HIGH"]

# Expected value calculation parameters (historical backtest estimates)
# WARNING: These are assumptions, not guarantees of future performance.
ev_win_rate: 0.45    # Estimated win rate (45%)
ev_avg_rr: 2.5       # Estimated average reward:risk ratio

# T1 target resistance snap — discount applied when snapping T1 to nearest resistance
resistance_snap_discount: 0.995  # Enter 0.5% below resistance to allow for spread

# Live order execution settings
live_position_store: "data/live_positions.json"  # Path for live position state JSON
monitor_interval_min: 5  # How often (minutes) to poll order fills during market hours

# Finviz provider — fundamentals snapshot + screener (src/data/providers/finviz.py).
# Finviz publishes no free API, so this reads public HTML. Default OFF: their terms
# restrict automated access and heavy use expects an Elite subscription, so enabling
# it is deliberately your decision. Rate-limited and cached when on; it fails soft
# (returns nothing) if the page layout changes, and never sits on the money path.
finviz:
  enabled: false
  min_request_interval_sec: 1.0   # floor between outbound requests (be a good citizen)
  cache_ttl_sec: 21600            # fundamentals cache (6h — these move slowly)
  screener_cache_ttl_sec: 900     # screener cache (15m — results move intraday)
  screener_max_results: 200       # hard cap on tickers returned per query
  # user_agent: ""                # defaults to the shared UFGenius UA

# Backtest realism
commission_pct: 0.001  # Per-side commission as a fraction of notional (0.001 = 0.1%)
slippage_pct: 0.001    # Per-side adverse slippage as a fraction of notional
# Which qualifying candidates win the scarce position slots (audit B2). Entries are
# rare, so this ordering decides which trades the strategy actually takes.
#   rotate       — date-seeded shuffle: reproducible AND name-neutral (default; the
#                  unbiased estimator of the entry rule's edge)
#   momentum     — strongest trend first (Close/SMA_200 - 1); an opt-in selection
#                  strategy, not a neutral fix
#   alphabetical — legacy biased order; only for reproducing pre-fix results
candidate_ranking: "rotate"
# Which entry signal the backtest replays (audit B1).
#   composite — replay the LIVE generate_signal scorer point-in-time. Only the
#               technical+volume dimensions are reconstructible for a past bar
#               (sentiment/fundamentals/macro are only ever served as of today),
#               so those weights are dropped and the rest renormalised. This is a
#               SUBSET of the live composite — results disclose it.
#   proxy     — legacy hardcoded SMA/RSI rule. Faster, but NOT the strategy that
#               trades live; a verdict from it says nothing about the composite.
signal_source: "proxy"
composite_min_score: 65   # enter at/above this composite score (65 = the live BUY threshold)
composite_stride: 1       # score every Nth bar in composite mode. ~28ms/bar means a full
                          # 503-ticker run is hours at 1; 5 (weekly) is practical. Skipped
                          # bars cannot open a position — an approximation, and disclosed.

# Strategy edge-validation gates (bot.py --mode validate, upgrade plan P0.1).
# An edge is only VALIDATED when it clears ALL of these on HELD-OUT out-of-sample
# data — the point is to reject noise, not to flatter. Tighten before trusting a
# strategy with capital.
validation:
  oos_sharpe_floor: 1.0                 # OOS point Sharpe must clear this
  bootstrap_sharpe_p05_floor: 0.0       # 5th-pct bootstrap Sharpe must stay above this
  prob_profitable_floor: 0.60           # ≥ this fraction of bootstrap resamples profitable
  window_profitable_fraction_floor: 0.60  # edge profitable in ≥ this fraction of ALL walk windows
  min_oos_trades: 20                    # reject verdicts on statistically thin OOS samples
  min_oos_days: 30                      # minimum OOS daily observations before a verdict counts
# Optional point-in-time universe membership JSON (audit M11). When a valid
# file loads, the backtest adds the file's tickers to the candidate set and
# only enters tickers that were universe members on the entry date. An invalid
# or unavailable file logs a warning and falls back to the run-time universe
# (survivorship disclosure then applies).
# Format: {"AAPL": [{"start": "2015-01-01", "end": null}], ...} — inclusive
# dates, null end = still a member, absent ticker = never a member.
# universe_history_path: "data/universe_history.json"
